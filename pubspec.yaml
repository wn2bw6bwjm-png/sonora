name: sonora
description: "SONORA — бесплатный музыкальный агрегатор с легальными источниками"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0

  # Dependency Injection
  get_it: ^8.3.0

  # Audio Playback
  just_audio: ^0.9.46
  audio_service: ^0.18.17
  audio_session: ^0.1.21

  # Local Storage
  hive: ^2.0.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Network
  dio: ^5.8.0
  http: ^1.4.0
  connectivity_plus: ^7.0.0

  # UI
  cupertino_icons: ^1.0.8

  # Utils
  uuid: ^4.5.2
  equatable: ^2.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true