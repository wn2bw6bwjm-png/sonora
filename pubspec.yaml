name: sonora
description: Premium music discovery and personal music library.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  fl_chart: ^0.69.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  cached_network_image: ^3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
flutter:
  uses-material-design: true
